services:
  - type: web
    name: hokiecrew-campus-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn --chdir VThacks_HokieCrew app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 --access-logfile - --error-logfile -
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABRICKS_HOST
        sync: false
      - key: DATABRICKS_WAREHOUSE_ID
        value: b8e09978c6080bb9
      # Option A: PAT token (simpler) - generate from Databricks User Settings
      - key: DATABRICKS_TOKEN
        sync: false
      # Option B: OAuth M2M (more secure) - requires service principal
      - key: DATABRICKS_AUTH_TYPE
        sync: false
      - key: DATABRICKS_CLIENT_ID
        sync: false
      - key: DATABRICKS_CLIENT_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TIGERDATA_URL
        sync: false
