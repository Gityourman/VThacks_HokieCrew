services:
  - type: web
    name: hokiecrew-campus-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn --chdir VThacks_HokieCrew app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 --access-logfile - --error-logfile -
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABRICKS_HOST
        value: https://dbc-2f59dc3b-5b06.cloud.databricks.com
      - key: DATABRICKS_WAREHOUSE_ID
        value: b8e09978c6080bb9
      - key: DATABRICKS_TOKEN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TIGERDATA_URL
        sync: false
